"$schema" = "./node_modules/wrangler/config-schema.json"

# This file is only used by the wrangler CLI (e.g. `wrangler d1 migrations
# apply`). The deployed Worker config — name, bindings, compatibility —
# is generated into `dist/wrangler.json` at build time by
# `@cloudflare/vite-plugin` (see `vite.config.ts`). Keep the D1 settings
# in both places in sync.

name = "npm-burst"
compatibility_date = "2026-03-09"
compatibility_flags = ["nodejs_compat"]
main = "vike:server-entry"

# Cloudflare Workers Assets intercepts every request before the Worker
# runs. Without `run_worker_first`, POSTs to non-asset paths like the
# telefunc RPC endpoint and the GitHub App routes can fall into the
# asset layer's `html_handling` / `not_found_handling` lookups and come
# back as 405 (assets only serve GET/HEAD). Listing those prefixes
# routes them directly to the Worker. Social cards are never assets, so
# they skip the lookup too.
[assets]
run_worker_first = ["/_telefunc", "/api/*", "/og/*"]

# Workers Cache sits in front of the social card entrypoint only. Pages,
# assets and the API keep the default entrypoint, uncached here, because
# enabling it there would bill every asset request. Pages have their own
# edge cache in `src/server/html-cache.ts`. The `cache` key needs wrangler
# 4.151 or later.
[exports.default]
type = "worker"
cache = { enabled = false }

[exports.OgCard]
type = "worker"
cache = { enabled = true }

[[routes]]
pattern = "npm-burst.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "npm-burst-db"
database_id = "273b28f0-f0e3-43e6-b7aa-1fd083c1ae6f"
# SQL files generated from src/server/migrations/*.ts via `nx run npm-burst:db:compile`.
migrations_dir = "./migrations"

[secrets]
required = ["VITE_CLERK_PUBLISHABLE_KEY",
    "CLERK_PUBLISHABLE_KEY",
    "CLERK_SECRET_KEY",
    "CLOUDFLARE_ACCOUNT_ID",
    "ENCRYPTION_KEY",
    "GITHUB_WEBHOOK_SECRET",
    "GITHUB_APP_ID",
    "GITHUB_APP_SLUG",
    "GITHUB_APP_PRIVATE_KEY"
]
